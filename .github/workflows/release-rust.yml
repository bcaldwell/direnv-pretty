name: Release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_artifacts:
    name: Build artifacts for ${{ matrix.asset_name_suffix }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name_suffix: x86_64-linux
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name_suffix: x86_64-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name_suffix: aarch64-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Rename artifacts
        run: mv target/${{ matrix.target }}/release/direnv-pretty direnv-pretty-${{ matrix.asset_name_suffix }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: direnv-pretty-${{ matrix.asset_name_suffix }}
          path: direnv-pretty-${{ matrix.asset_name_suffix }}

  deploy_artifacts:
    name: Create release
    needs: [build_artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          path: release

      - name: Generate checksum
        run: sha256sum release/*/* > checksum.txt

      - run: ls -R release && cat checksum.txt

      - name: Create release with artifact
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            release/*/*
            checksum.txt
